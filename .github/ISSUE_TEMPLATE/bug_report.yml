---
name: 🐛 Сообщение об ошибке
description: Создавайте только, если проблема точно не на вашей стороне.
title: "[BUG] "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за создание отчета об ошибке!
        
        Перед отправкой, пожалуйста:
        - Проверьте [существующие issues](https://github.com/podkop-net/podkop-experimental/issues)
        - Просмотрите [документацию](https://podkop.net)

  - type: textarea
    id: description
    attributes:
      label: 📝 Описание проблемы
      description: Четкое и краткое описание того, что не работает
      placeholder: Опишите проблему
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Шаги для воспроизведения
      description: Шаги для воспроизведения проблемы. Если вы настраваете что-то по мануалу, приложите ссылку на него.
      placeholder: |
        1. 
        2. 
        3. 
        4. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: ✅ Ожидаемое поведение
      description: Четкое и краткое описание того, что должно было произойти
      placeholder: Опишите ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 🖥️ Информация о системе
      description: |
        Информация о вашей системе (заполните всё применимое)
      value: |
        - **OpenWrt версия**: 
        - **Podkop версия**: 
        - **Роутер модель**: 
        - **Sing-box версия**: 
      render: markdown
    validations:
      required: true

  - type: textarea
    id: global_check
    attributes:
      label: 🩺 Глобальная проверка
      description: |
        «Диагностика» → «Получить глобальную проверку» (или `podkop global_check` в консоли роутера). Ключи и пароли в ней уже скрыты.
      render: shell
    validations:
      required: true

  - type: textarea
    id: bittorrent_record
    attributes:
      label: 🧲 Отчёт о BitTorrent (если вопрос о BitTorrent)
      description: |
        `podkop bittorrent_record 10 --reset` в консоли роутера, затем загрузка в клиенте; через 10 минут — содержимое файла, который назовёт команда. В нём только числа, без адресов.
      render: shell
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: ⚙️ Конфигурация
      description: |
        Релевантные части конфигурации (удалите чувствительную информацию!)
      placeholder: |
        Например:
        - Содержимое /etc/config/podkop
        - Конфигурация sing-box (если релевантно)
        - Дополнительные конфиги, которые потребуются wireless/network/dhcp и т.д.
      render: shell