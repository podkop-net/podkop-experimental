name: Build packages
# the title of a run: GitHub shows the message of the last commit, the tag or branch tells more
run-name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || format('Test build of {0}', github.ref_name) }}
on:
  push:
    tags:
      - '*'
  # a test build of the branch, without a release
  workflow_dispatch:
    inputs:
      only:
        description: "Only these architectures of podkop, comma-separated (empty: all), e.g. x86_64,aarch64_cortex-a53"
        default: ""

permissions:
  contents: write

jobs:
  preparation:
    name: Setup build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "0.$(date +%d%m%Y)")
          # a tag is written v0.8.0; the builds take the number and add the letter where the
          # package manager wants it (sdk/build.sh, Dockerfile-ipk)
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # a release is built only on a published podkop-engine state (tag or pre-release tag)
      - name: podkop-engine of go.mod is released
        if: github.event_name == 'push'
        run: sh sdk/check-engine.sh

  matrix:
    name: Architectures of podkop
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5.0.0
      - id: gen
        run: |
          python3 sdk/gen-matrix.py --ipk-release 24.10.8 --apk-release 25.12.5 ${{ inputs.only && format('--only {0}', inputs.only) || '' }} > matrix.json
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"
          jq -r '.include[] | "\(.format) \(.pkgarch) \(.image)"' matrix.json >> "$GITHUB_STEP_SUMMARY"

  # podkop holds a Go program: one package for each architecture, built in the SDK of OpenWrt
  # for that architecture
  podkop:
    name: podkop ${{ matrix.format }} ${{ matrix.pkgarch }}
    runs-on: ubuntu-latest
    needs: [preparation, matrix]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5.0.0

      - name: Cache downloads (the sources of Go, Go modules)
        uses: actions/cache@v4.2.3
        with:
          path: dl
          key: dl-${{ hashFiles('sdk/golang-feed.sh', 'src/backend/go.sum') }}
          restore-keys: dl-

      - name: Build in ${{ matrix.image }}
        run: |
          mkdir -p out dl && chmod 777 out dl
          docker run --rm --user root -e PODKOP_VERSION=${{ needs.preparation.outputs.version }} \
            -v "$PWD:/src:ro" -v "$PWD/out:/out" -v "$PWD/dl:/builder/dl" \
            "${{ matrix.image }}" sh /src/sdk/build.sh

      - name: Upload the package
        uses: actions/upload-artifact@v4.6.2
        with:
          name: podkop-${{ matrix.format }}-${{ matrix.pkgarch }}
          path: out/podkop-*.${{ matrix.format }}
          retention-days: 1
          if-no-files-found: error

  build:
    name: Builder for ${{ matrix.package_type }} luci-app-podkop
    runs-on: ubuntu-latest
    needs: preparation
    strategy:
      matrix:
        include:
          - { package_type: ipk }
          - { package_type: apk }
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Build ${{ matrix.package_type }}
        uses: docker/build-push-action@v6.18.0
        with:
          file: ./Dockerfile-${{ matrix.package_type }}
          context: .
          tags: podkop:ci-${{ matrix.package_type }}
          build-args: |
            PODKOP_VERSION=${{ needs.preparation.outputs.version }}
            PACKAGES=luci-app-podkop

      - name: Create ${{ matrix.package_type }} Docker container
        run: docker create --name ${{ matrix.package_type }} podkop:ci-${{ matrix.package_type }}

      - name: Copy files from ${{ matrix.package_type }} Docker container
        run: |
          mkdir -p ./bin/${{ matrix.package_type }}
          docker cp ${{ matrix.package_type }}:/builder/bin/packages/x86_64/utilities/. ./bin/${{ matrix.package_type }}/
          docker cp ${{ matrix.package_type }}:/builder/bin/packages/x86_64/luci/. ./bin/${{ matrix.package_type }}/

        # IPK uses underscore `_` in filenames, while APK uses only dash `-`
      - name: Fix naming difference between build for packages (replace _ with -)
        if: matrix.package_type == 'ipk'
        shell: bash
        run: |
          for f in ./bin/${{ matrix.package_type }}/*.${{ matrix.package_type }}; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            newname=$(echo "$base" | sed 's/_/-/g')
            mv "$f" "./bin/${{ matrix.package_type }}/$newname"
          done

      - name: Filter files
        shell: bash
        run: |
          # Use version from preparation job (already without 'v' prefix)
          VERSION="${{ needs.preparation.outputs.version }}"

          mkdir -p ./filtered-bin/${{ matrix.package_type }}
          cp ./bin/${{ matrix.package_type }}/luci-i18n-podkop-exp-ru-*.${{ matrix.package_type }} "./filtered-bin/${{ matrix.package_type }}/luci-i18n-podkop-exp-ru-${VERSION}.${{ matrix.package_type }}"
          cp ./bin/${{ matrix.package_type }}/luci-app-podkop-exp-*.${{ matrix.package_type }} ./filtered-bin/${{ matrix.package_type }}/

      - name: Remove Docker container
        run: docker rm ${{ matrix.package_type }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: release-files-${{ github.ref_name }}-${{ matrix.package_type }}
          path: ./filtered-bin/${{ matrix.package_type }}/*.${{ matrix.package_type }}
          retention-days: 1
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, podkop]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5.0.0
      - name: Create release dir
        run: mkdir -p ./filtered-bin/release

      - name: Download ipk artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files-${{ github.ref_name }}-ipk
          path: ./filtered-bin/release

      - name: Download apk artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files-${{ github.ref_name }}-apk
          path: ./filtered-bin/release

      - name: Download the packages podkop
        uses: actions/download-artifact@v4
        with:
          # podkop-ipk-<pkgarch> and podkop-apk-<pkgarch> only: "podkop-*" takes the build
          # records of docker/build-push-action as well, named <owner>~<repository>~<id>.dockerbuild
          # (podkop-net~...), which are no zip archives, and the download fails
          pattern: podkop-?pk-*
          merge-multiple: true
          path: ./filtered-bin/release

      - name: Release
        uses: softprops/action-gh-release@v2.4.0
        with:
          files: ./filtered-bin/release/*.*
          draft: false
          prerelease: false
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}