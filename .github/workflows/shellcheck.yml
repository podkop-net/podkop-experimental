name: ShellCheck

# Two checks of the shell scripts: the differential one (the new findings of a change, severity
# error, as code scanning alerts) and a full one (every script, severity warning, the findings of
# .github/ci/shellcheck.baseline aside), which also reads the scripts that only the packages'
# Makefiles hold (postinst, prerm) and what runs on OpenWrt as busybox's sh.
on:
  push:
    branches:
      - main
      - 'rc/**'
    paths:
      - 'install.sh'
      - 'podkop/**'
      - 'luci-app-podkop/**'
      - 'sdk/**'
      - 'yacd/**'
      - '.github/ci/shellcheck.*'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches:
      - main
      - 'rc/**'
    paths:
      - 'install.sh'
      - 'podkop/**'
      - 'luci-app-podkop/**'
      - 'sdk/**'
      - 'yacd/**'
      - '.github/ci/shellcheck.*'
      - '.github/workflows/shellcheck.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    name: Differential ShellCheck
    runs-on: ubuntu-24.04
    
    permissions:
      contents: read
      security-events: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0
      
      - name: Differential ShellCheck
        uses: redhat-plumbers-in-action/differential-shellcheck@v5.5.5
        with:
          severity: error
          include-path: |
            podkop/files/etc/init.d/*
            podkop/files/etc/uci-defaults/*
            podkop/files/etc/hotplug.d/iface/*
            sdk/*.sh
            install.sh
          token: ${{ secrets.GITHUB_TOKEN }}

  full:
    name: ShellCheck of every script
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      # a pinned image: another version of ShellCheck words its findings otherwise (the baseline)
      - name: ShellCheck, severity warning
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck-alpine:v0.11.0 sh .github/ci/shellcheck.sh
